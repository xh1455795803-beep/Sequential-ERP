server_tokens off;
server {
    server_name thalvior.icu;

    # 商品图上传（nginx 默认 1MB -> 413）
    client_max_body_size 50m;

    # ===== 自定义主题 CSS（脱离 dist，部署不覆盖）=====


    # ===== 自定义增强 JS（脱离 dist，部署不覆盖）=====


    # ===== AI 计费文案积分口径覆盖层 =====






    # 1) 注入自定义增强 JS（必须在 head 中、前端 module 脚本之前执行，用于修复 fetch this 绑定）

    # 2) 注入自定义主题 CSS（在原 CSS 之后，靠层叠覆盖）

    # 3) favicon → Thalvior 品牌（深海底 + 暖橙菱形，2026-09-27 修正）

    # 4) JS 内图表配色 -> 美式蓝灰系
    # 图表 8 色调色板 → Thalvior 品牌色（暖橙 / 海港青 / 深海蓝，2026-09-27 修正）

    root /var/www/meoo;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml+rss;
    gzip_min_length 1024;

    # ===== 自建 Supabase 网关反代 =====
    location /rest/v1/ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /auth/v1/ {
        limit_req zone=auth_z burst=5 nodelay;
        include /etc/nginx/conf.d/security-headers.conf;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /storage/v1/ {
        client_max_body_size 50m;
        include /etc/nginx/conf.d/security-headers.conf;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /functions/v1/ {
        add_header Cache-Control "no-store" always;
        limit_req zone=fn_z burst=20 nodelay;
        client_max_body_size 50m;
        include /etc/nginx/conf.d/security-headers.conf;
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===== 后端 FastAPI /api 反代 =====
    location /api/ {
        include /etc/nginx/conf.d/security-headers.conf;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
    }
    location /realtime/v1/ {
        include /etc/nginx/conf.d/security-headers.conf;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===== 合规页（隐私政策 / 用户协议）=====
    location = /privacy {
        root /var/www/legal;
        try_files /privacy.html =404;
        default_type text/html;
        include /etc/nginx/conf.d/security-headers.conf;
    }
    location = /terms {
        root /var/www/legal;
        try_files /terms.html =404;
        default_type text/html;
        include /etc/nginx/conf.d/security-headers.conf;
    }
    location = /refund {
        root /var/www/legal;
        try_files /refund.html =404;
        default_type text/html;
        include /etc/nginx/conf.d/security-headers.conf;
    }
    # ===== 订阅 / AI 积分中心：独立真实页面（数据源：Supabase REST）=====
# [20261011] 切换 /subscription 到 SPA（React 订阅中心完整版，含店铺授权额度）；旧静态页保留于 /var/www/subscribe
    # location = /subscription {
    # include /etc/nginx/conf.d/security-headers.conf;
    # root /var/www/subscribe;
    # try_files /index.html =404;
    # default_type text/html;
    # add_header Cache-Control "no-store, no-cache, must-revalidate";
    # add_header Expires "0" always;
    # add_header Pragma "no-cache" always;
    # }
    location = /subscribe {
        include /etc/nginx/conf.d/security-headers.conf;
        return 301 /subscription;
    }

    # ===== 发票管理：独立真实页面（财务中心子功能）=====

    # ===== 营销落地页（根路径 + /index.html 统一，带登录态检测） =====
    location /downloads/ {
        root /var/www/meoo;
    }

# [wB 20261117] explicit 404 so removed WP paths do not fall through to the SPA (200)
    location /woo/ {
        return 404;
    }

# [wB 20261117] /woo/ WordPress test proxy DISABLED (kill the public WP surface)
# location /woo/ {
# proxy_pass http://127.0.0.1:8088/;
# proxy_set_header X-Forwarded-Proto $scheme;
# proxy_set_header X-Forwarded-Host $host;
# proxy_set_header Host $host;
# proxy_set_header X-Real-IP $remote_addr;
# client_max_body_size 20m;
# }
    location = / {
        include /etc/nginx/conf.d/security-headers.conf;
        root /var/www/meoo;
        try_files /index.html =404;
        default_type text/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.conf;
        root /var/www/meoo;
        try_files /index.html =404;
        default_type text/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Expires "0" always;
        add_header Pragma "no-cache" always;
    }
    # SPA 前端路由回退：命名 location 仅供内部跳转，避免被 /index.html 精确匹配劫持
    location @spa {
        include /etc/nginx/conf.d/security-headers.conf;
        root /var/www/meoo;
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Expires "0" always;
        add_header Pragma "no-cache" always;
    }

    # SPA 静态资源：带 hash，长缓存
    # >>> thalvior 订购页 chunk 覆盖发布（幂等块）
    # <<< thalvior 订购页 chunk
    # >>> thalvior cache-bust 20260929
    # <<< thalvior cache-bust 20260929
    # SaaS assets (shared by /wms /merchant /admin)
    location /assets/ {
        alias /var/www/meoo/assets/;
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA 前端路由回退：HTML 不缓存，确保每次拉最新；回退指向命名 location @spa
    
  
  # >>> thalvior final-theme 20260929
  # <<< thalvior final-theme 20260929

  # >>> thalvior landing shots 20261024
  location ^~ /shots/ {
      root /var/www/wms;
      try_files $uri =404;
      add_header Cache-Control "public, max-age=86400";
  }
  # <<< thalvior landing shots 20261024

  # >>> thalvior softmist preview
  location ^~ /preview-next/ {
      alias /var/www/preview-next/;
      index index.html;
      try_files $uri $uri/ /preview-next/index.html;
      add_header Cache-Control "no-store, no-cache, must-revalidate";
  }
  # <<< thalvior softmist preview



        # ===== 源码包下载专用（不走 SPA try_files）=====
        location ^~ /d/ {
            alias /var/www/downloads/;
            autoindex off;
            add_header Content-Disposition 'attachment' always;
            add_header Cache-Control "no-cache" always;
            include /etc/nginx/conf.d/security-headers.conf;
        }
    # ===== Thalvior SaaS 代打包系统（多入口 SPA）=====
    location ^~ /wms/ {
        alias /var/www/wms/;
        index index.html;
        try_files $uri $uri/ /wms/index.html;
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    location = /wms { return 301 /wms/; }

    location ^~ /erp/ {
        alias /var/www/wms/;
        index index.html;
        try_files $uri $uri/ /erp/index.html;
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    location = /erp { return 301 /erp/; }

    location ^~ /dashboard/ {
        alias /var/www/wms/;
        index index.html;
        try_files $uri $uri/ /dashboard/index.html;
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    location = /dashboard { return 301 /dashboard/; }


    location ^~ /merchant/ {
        alias /var/www/wms/;
        index index.html;
        try_files $uri $uri/ /merchant/index.html;
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    location = /merchant { return 301 /merchant/; }

    location ^~ /admin/ {
        alias /var/www/wms/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    location = /admin { return 301 /admin/; }


    # >>> 货代门户迁至 thalvior.fun（20261118）
    location ^~ /portal/ {
        return 301 https://thalvior.fun$request_uri;
    }
    # <<< 货代门户迁至 thalvior.fun
    location / {
      include /etc/nginx/conf.d/security-headers.conf;
        limit_req zone=gen_z burst=50 nodelay;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Expires "0" always;
        add_header Pragma "no-cache" always;
        try_files $uri $uri/ @spa;
    }

    # 安全头（统一注入，见 conf.d/security-headers.conf）
    include /etc/nginx/conf.d/security-headers.conf;

    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/thalvior.icu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thalvior.icu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name thalvior.icu;
    return 301 https://$host$request_uri;
}
