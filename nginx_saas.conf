# Thalvior SaaS — 多入口代打包系统
# 覆盖 /wms/ /merchant/ /admin/ 三个入口
location ^~ /wms/ {
    alias /var/www/saas/;
    index index.html;
    try_files $uri $uri/ /wms/index.html;
    include /etc/nginx/conf.d/security-headers.conf;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
}
location = /wms {
    return 301 /wms/;
}

location ^~ /merchant/ {
    alias /var/www/saas/;
    index index.html;
    try_files $uri $uri/ /merchant/index.html;
    include /etc/nginx/conf.d/security-headers.conf;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
}
location = /merchant {
    return 301 /merchant/;
}

location ^~ /admin/ {
    alias /var/www/saas/;
    index index.html;
    try_files $uri $uri/ /admin/index.html;
    include /etc/nginx/conf.d/security-headers.conf;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
}
location = /admin {
    return 301 /admin/;
}
