<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1a63e8" />
    <meta name="description" content="Thalvior 跨境电商仓库管理系统 — 商家端 / 仓库端(PDA扫码) / 货代端 三端联动" />
    <!-- PWA -->
    <link rel="manifest" href="/wms/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/wms/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Thalvior WMS" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <!-- 品牌 favicon（内联 SVG，和 meoo 一致，避免外链） -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a63e8'/%3E%3Cpath d='M7 20h18M16 7v18' stroke='%23ffffff' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>Thalvior · WMS 仓库管理系统</title>

    <!-- 主题切换脚本 — 和 meoo 完全一致，React 加载前立即生效避免闪烁 -->
    <script>
      (function() {
        function applyTheme(theme) {
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute('data-theme', theme);
        }
        function resolveTheme(mode) {
          if (mode === 'dark') return 'dark';
          if (mode === 'light') return 'light';
          try { return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
          catch (e) { return 'light'; }
        }
        var saved = 'system';
        try { saved = localStorage.getItem('thalvior_theme') || 'system'; } catch (e) {}
        applyTheme(resolveTheme(saved));
        try {
          window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
            try { var m = localStorage.getItem('thalvior_theme') || 'system'; } catch (e) { m = 'system'; }
            if (m === 'system') applyTheme(resolveTheme('system'));
          });
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
