services:
  app:
    build: .
    image: thalvior-erp:1.0
    container_name: thalvior_app
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - thalvior

  web:
    image: nginx:1.27-alpine
    container_name: thalvior_web
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - ./frontend/static:/usr/share/nginx/html/static:ro
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
    networks:
      - thalvior

networks:
  thalvior:
    driver: bridge
