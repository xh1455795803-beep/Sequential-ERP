        </tbody></table></div>
    </div>`;
}


function openModal(title, bodyHtml, footHtml, wide) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHtml;
  document.getElementById('modal-foot').innerHTML = footHtml;
  document.getElementById('modal-box').className = 'modal' + (wide ? ' wide' : '');
  document.getElementById('modal-mask').classList.add('show');
}
function closeModal() { document.getElementById('modal-mask').classList.remove('show'); }

// 后端真实字段：id, product_id, sku, product_name, warehouse, change_type, qty_change, qty_before, qty_after, balance_field, ref_type, ref_id, operator, remark, created_at
const LEDGER_TYPE_LABEL = { inbound:'入库', outbound:'出库', manual:'手动调整', purchase:'采购入库', ship_lock:'订单占用', ship_deduct:'发货扣减', cancel_unlock:'取消释放', init:'期初', sync_in:'平台同步入库', sync_out:'平台同步出库', IN:'入库', OUT:'出库', ADJUST:'盘点调整', INIT:'期初', SHIP_LOCK:'订单占用', SHIP_DEDUCT:'发货扣减', CANCEL_UNLOCK:'取消释放', PURCHASE:'采购入库' };
const LEDGER_TYPE_CLASS = { inbound:'green', outbound:'red', manual:'blue', purchase:'green', ship_lock:'amber', ship_deduct:'red', cancel_unlock:'green', init:'amber', sync_in:'green', sync_out:'red', IN:'green', OUT:'red', ADJUST:'blue', INIT:'amber', SHIP_LOCK:'amber', SHIP_DEDUCT:'red', CANCEL_UNLOCK:'green', PURCHASE:'green' };

const AUDIT_ACTION_LABEL = { LOGIN:'登录', LOGIN_FAIL:'登录失败', LOGOUT:'登出', auth_register:'注册', auth_login:'登录', auth_logout:'登出', CREATE:'新增', UPDATE:'修改', DELETE:'删除', SHIP:'发货', IN_STOCK:'入库', OUT_STOCK:'出库', REFRESH_TOKEN:'刷新令牌', SYNC:'同步', CONFIG:'配置修改', ROLE_CHANGE:'角色变更', PASSWORD_RESET:'重置密码', SUBACCOUNT_CREATE:'新建子账号', SUBACCOUNT_DELETE:'删除子账号', OTHER:'其他', user:'账号', shop:'店铺', product:'商品', order:'订单', inventory:'库存', carrier:'物流', purchase:'采购', supplier:'供应商', tenant:'租户' };
const AUDIT_ACTION_CLASS = { LOGIN:'green', LOGIN_FAIL:'red', LOGOUT:'neutral', auth_register:'green', auth_login:'green', auth_logout:'neutral', CREATE:'green', UPDATE:'blue', DELETE:'red', SHIP:'blue', IN_STOCK:'green', OUT_STOCK:'red', REFRESH_TOKEN:'blue', SYNC:'blue', CONFIG:'amber', ROLE_CHANGE:'amber', PASSWORD_RESET:'amber', SUBACCOUNT_CREATE:'green', SUBACCOUNT_DELETE:'red', OTHER:'neutral' };

/* ================= 库存流水 ================= */
async function loadInventoryLedger() {
  const r = await api('/inventory/transactions?size=200');
  const items = (r.items || []).map(it => ({
    created_at: it.created_at,
    change_type: it.change_type || it.changeType,
    sku: it.sku,
    product_name: it.product_name,
    warehouse_code: it.warehouse || 'MAIN',
    change_qty: it.qty_change != null ? it.qty_change : it.qtyChange,
    balance_after: it.qty_after != null ? it.qty_after : it.balance_after,
    related_no: it.ref_id || it.refId || (it.ref_type ? it.ref_type + ':' + (it.ref_id || '') : ''),
    remark: it.remark
  }));
  const TL = LEDGER_TYPE_LABEL, TC = LEDGER_TYPE_CLASS;
  document.getElementById('content').innerHTML = `
    <div class="card">
      <div class="card-head"><h3>库存流水（最近 ${items.length} 条）</h3>
        <div class="filter-bar">
          <input class="input-sm" placeholder="搜索 SKU / 单号" id="il-search" oninput="renderInventoryLedger()">
          <select id="il-type" onchange="renderInventoryLedger()"><option value="">全部类型</option>${Object.keys(TL).map(k=>`<option value="${k}">${TL[k]}</option>`).join('')}</select>
        </div>
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>时间</th><th>类型</th><th>SKU / 商品</th><th>仓</th><th>变动</th><th>变后余额</th><th>关联单号</th><th>备注</th></tr></thead>
        <tbody id="il-body"></tbody>
      </table></div>
    </div>`;
  window._ledgerItems = items;
  renderInventoryLedger();
}
function renderInventoryLedger() {
  const items = (window._ledgerItems || []).slice();
  const kw = (document.getElementById('il-search').value || '').trim().toLowerCase();
  const tp = document.getElementById('il-type').value || '';
  const TL = LEDGER_TYPE_LABEL, TC = LEDGER_TYPE_CLASS;
  const rows = items.filter(it => {
    if (tp && it.change_type !== tp) return false;
    if (kw) {
      const hay = (it.sku + ' ' + (it.product_name || '') + ' ' + (it.related_no || '') + ' ' + (it.remark || '')).toLowerCase();
      if (!hay.includes(kw)) return false;
    }
    return true;
  });
  document.getElementById('il-body').innerHTML = rows.length ? rows.map(it => {
    const delta = Number(it.change_qty || 0);
    const sign = delta > 0 ? '+' : '';
    const colorClass = delta >= 0 ? 'var(--green)' : 'var(--red)';
    return `<tr>
      <td style="white-space:nowrap">${fmtDate(it.created_at)}</td>
      <td><span class="badge ${TC[it.change_type] || 'neutral'}">${TL[it.change_type] || it.change_type || '-'}</span></td>
      <td><b>${esc(it.sku || '')}</b>${it.product_name ? `<div style="font-size:12px;color:var(--text-2)">${esc(it.product_name)}</div>` : ''}</td>
      <td>${esc(it.warehouse_code || 'MAIN')}</td>
      <td style="font-weight:700;color:${colorClass}">${it.change_qty != null ? sign + delta : '-'}</td>
      <td>${it.balance_after != null ? it.balance_after : '-'}</td>
      <td style="font-family:ui-monospace,monospace;font-size:12.5px;color:var(--text-2)">${it.related_no ? esc(it.related_no) : '-'}</td>
      <td>${it.remark ? esc(it.remark) : '<span style="color:var(--text-3)">-</span>'}</td>
    </tr>`;
  }).join('') : `<tr><td colspan="8"><div class="empty">暂无流水记录</div></td></tr>`;
}

/* ================= 审计日志 ================= */
async function loadAuditLogs() {
  const r = await api('/audit/logs?size=200');
  const items = (r.items || []).map(it => ({
    created_at: it.created_at,
    action: it.action,
    username: it.username,
    role: it.role,
    ip: it.ip,
    module: it.module || it.target_type || '-',
    target: (it.target_type && it.target_id) ? it.target_type + ':' + it.target_id : (it.target_id || it.target || ''),
    detail: it.detail
  }));
  const AL = AUDIT_ACTION_LABEL, AC = AUDIT_ACTION_CLASS;
  document.getElementById('content').innerHTML = `
    <div class="card">
      <div class="card-head"><h3>操作审计日志（最近 ${items.length} 条）</h3>
        <div class="filter-bar">
          <input class="input-sm" placeholder="搜索用户 / IP / 目标 / 详情" id="al-search" oninput="renderAuditLogs()">
          <select id="al-action" onchange="renderAuditLogs()"><option value="">全部操作</option>${Object.keys(AL).map(k=>`<option value="${k}">${AL[k]}</option>`).join('')}</select>
        </div>
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>时间</th><th>操作</th><th>用户</th><th>IP</th><th>模块</th><th>目标</th><th>详情</th></tr></thead>
        <tbody id="al-body"></tbody>
      </table></div>
    </div>`;
  window._auditItems = items;
  renderAuditLogs();
}
function renderAuditLogs() {
  const items = (window._auditItems || []).slice();
  const kw = (document.getElementById('al-search').value || '').trim().toLowerCase();
  const ac = document.getElementById('al-action').value || '';
  const AL = AUDIT_ACTION_LABEL, AC = AUDIT_ACTION_CLASS;
  const rows = items.filter(it => {
    if (ac && it.action !== ac) return false;
    if (kw) {
      const hay = ((it.username || '') + ' ' + (it.ip || '') + ' ' + (it.module || '') + ' ' + (it.target || '') + ' ' + (typeof it.detail === 'string' ? it.detail : JSON.stringify(it.detail || ''))).toLowerCase();
      if (!hay.includes(kw)) return false;
    }
    return true;
  });
  document.getElementById('al-body').innerHTML = rows.length ? rows.map(it => {
    let detailStr = '';
    try {
      const d = typeof it.detail === 'string' ? ((it.detail.startsWith('{') || it.detail.startsWith('[')) ? JSON.parse(it.detail || '{}') : it.detail) : (it.detail || {});
      detailStr = (typeof d === 'string') ? d : Object.keys(d).map(k => `${k}: ${typeof d[k]==='object'?JSON.stringify(d[k]):d[k]}`).join('  ·  ');
    } catch { detailStr = String(it.detail || ''); }
    return `<tr>
      <td style="white-space:nowrap">${fmtDate(it.created_at)}</td>
      <td><span class="badge ${AC[it.action] || 'neutral'}">${AL[it.action] || it.action || '-'}</span></td>
      <td><b>${esc(it.username || '-')}</b>${it.role ? `<div style="font-size:11px;color:var(--text-3)">${esc(it.role)}</div>` : ''}</td>
      <td style="font-family:ui-monospace,monospace;font-size:12.5px">${esc(it.ip || '-')}</td>
      <td>${esc(it.module || '-')}</td>
      <td style="font-family:ui-monospace,monospace;font-size:12.5px">${it.target ? esc(it.target) : '-'}</td>
      <td style="font-size:12.5px;color:var(--text-2);max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(detailStr)}">${detailStr ? esc(detailStr) : '<span style="color:var(--text-3)">-</span>'}</td>
    </tr>`;
  }).join('') : `<tr><td colspan="7"><div class="empty">暂无审计记录</div></td></tr>`;
}

/* ================= 通知中心 ================= */
async function loadNotifBadge() {
  try {
    const r = await api('/notifications?limit=50');
    const items = (r.items || r || []);
    const unread = items.filter(i => !i.is_read).length;
    const dot = document.getElementById('notif-dot');
    if (dot) {
      if (unread > 0) { dot.style.display = 'flex'; dot.textContent = unread > 99 ? '99+' : String(unread); }
      else { dot.style.display = 'none'; dot.textContent = '0'; }
    }
    window.__notifCache = items;
    const panel = document.getElementById('notif-list');
    if (panel) renderNotifList(items);
  } catch (e) {}
}
function renderNotifList(items) {
  const TYPE_LABEL = { INFO:'系统', WARNING:'告警', SUCCESS:'成功', ERROR:'失败' };
  const TYPE_CLASS = { INFO:'blue', WARNING:'amber', SUCCESS:'green', ERROR:'red' };
  const list = document.getElementById('notif-list');
  if (!list) return;
  if (!items.length) { list.innerHTML = `<div class="notif-empty">暂无通知</div>`; return; }
  list.innerHTML = items.map(n => {
    const t = n.type || 'INFO';
    return `<div class="notif-item ${n.is_read ? '' : 'unread'}" onclick="readNotif(${n.id})">
      <div class="notif-title"><span>${esc(n.title || '无标题')}</span><span class="badge ${TYPE_CLASS[t] || 'neutral'}">${TYPE_LABEL[t] || t}</span></div>
      <div class="notif-body">${esc(n.body || '')}</div>
      <div class="notif-meta"><span>${esc(n.from || '系统')}</span><span>${fmtDate(n.created_at)}</span></div>
    </div>`;
  }).join('');
}
function toggleNotif() {
  const p = document.getElementById('notif-panel');
  p.classList.toggle('show');
  if (p.classList.contains('show') && (!window.__notifCache || !window.__notifCache.length)) loadNotifBadge();
  setTimeout(() => { if (p.classList.contains('show')) {
    const hd = (e) => { if (!(e.target.closest && e.target.closest('#notif-btn'))) { p.classList.remove('show'); document.removeEventListener('click', hd); } };
    document.addEventListener('click', hd);
  }}, 10);
}
async function readNotif(id) {
  try {
    await api('/notifications/' + id + '/read', 'POST');
    if (window.__notifCache) { const x = window.__notifCache.find(i => i.id === id); if (x) x.is_read = true; renderNotifList(window.__notifCache); }
    loadNotifBadge();
  } catch (e) {}
}
async function readAllNotif() {
  try {
    await api('/notifications/read-all', 'POST');
    if (window.__notifCache) window.__notifCache.forEach(n => n.is_read = true);
    if (window.__notifCache) renderNotifList(window.__notifCache);
    loadNotifBadge();
    toast('已全部标为已读', 'ok');
  } catch (e) { toast(e.message, 'err'); }
}

  if (!token) return;
  try {
    const r = await api('/auth/me');
    me = r.user; tenant = r.tenant;
    enterApp();
  } catch { logout(true); }
})();
