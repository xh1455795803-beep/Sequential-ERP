<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数序ERP 控制台 - 跨境电商ERP管理系统</title>
<meta name="robots" content="noindex">
<style>
:root{
  --primary:#4f46e5;--primary-dark:#4338ca;--primary-light:#eef2ff;
  --bg:#f4f5f9;--card:#fff;--text:#1e293b;--text-2:#64748b;--text-3:#94a3b8;
  --border:#e2e8f0;--green:#059669;--green-bg:#ecfdf5;--red:#dc2626;--red-bg:#fef2f2;
  --amber:#d97706;--amber-bg:#fffbeb;--blue:#2563eb;--blue-bg:#eff6ff;--gray-bg:#f1f5f9;
  --radius:12px;--shadow:0 1px 3px rgba(16,24,40,.08);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select{font-family:inherit;font-size:14px;padding:9px 12px;border:1px solid var(--border);border-radius:8px;width:100%;outline:none;transition:border .15s}
input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.1)}
label{display:block;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:6px}

/* ===== 登录页 ===== */
#login-view{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#eef2ff 0%,#f8fafc 50%,#e0e7ff 100%);padding:20px}
.login-card{background:#fff;border-radius:16px;box-shadow:0 20px 50px rgba(79,70,229,.12);padding:40px;width:100%;max-width:400px}
.login-logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px}
.login-logo .mark{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
.login-logo .name{font-size:20px;font-weight:800}
.login-sub{text-align:center;color:var(--text-2);font-size:13px;margin-bottom:24px}
.login-tabs{display:flex;background:var(--gray-bg);border-radius:10px;padding:4px;margin-bottom:20px}
.login-tabs button{flex:1;padding:8px;border-radius:8px;font-weight:600;color:var(--text-2);font-size:14px}
.login-tabs button.on{background:#fff;color:var(--primary);box-shadow:var(--shadow)}
.login-field{margin-bottom:14px}
.login-err{background:var(--red-bg);color:var(--red);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:14px;display:none}
.btn-primary{background:var(--primary);color:#fff;padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;transition:background .15s}
.btn-primary:hover{background:var(--primary-dark)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed}
.login-submit{width:100%;padding:11px;font-size:15px;margin-top:6px}
.login-back{text-align:center;margin-top:18px}
.login-back a{color:var(--text-3);font-size:13px;text-decoration:none}
.login-back a:hover{color:var(--primary)}
.login-trial-note{margin-top:16px;padding:10px;background:var(--primary-light);border-radius:8px;font-size:12px;color:var(--primary);text-align:center;line-height:1.6}

/* ===== 主布局 ===== */
#app-view{display:none;min-height:100vh}
.layout{display:flex;min-height:100vh}
.sidebar{width:216px;background:#fff;border-right:1px solid var(--border);padding:16px 12px;position:fixed;top:0;bottom:0;left:0;z-index:10;display:flex;flex-direction:column}
.sidebar .brand{display:flex;align-items:center;gap:9px;padding:6px 8px 18px}
.sidebar .brand .mark{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.sidebar .brand .name{font-weight:800;font-size:16px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:var(--text-2);font-weight:600;margin-bottom:2px;transition:all .15s;text-decoration:none;font-size:14px}
.nav-item:hover{background:var(--primary-light);color:var(--primary)}
.nav-item.on{background:var(--primary-light);color:var(--primary)}
.nav-item svg{width:18px;height:18px;flex:none}
/* 分组子菜单 */
.nav-group{margin-bottom:6px}
.nav-group-title{display:flex;align-items:center;gap:8px;padding:12px 12px 4px;font-size:11px;font-weight:700;color:var(--text-3);letter-spacing:.08em;text-transform:uppercase}
.nav-group-title svg{width:14px;height:14px;flex:none;opacity:.7}
.nav-item.sub{padding:8px 12px 8px 34px;font-weight:500;font-size:13.5px;position:relative}
.nav-item.sub::before{content:'';width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.4;position:absolute;margin-left:-14px}
.sidebar{overflow-y:auto}
/* 平台授权卡片 */
.plat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.plat-card{border:1px solid var(--border);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px;background:#fff}
.seg-tabs{display:flex;background:var(--gray-bg);border-radius:10px;padding:4px;margin-bottom:16px;max-width:360px}
.seg-tabs button{flex:1;padding:8px;border-radius:8px;font-weight:600;color:var(--text-2);font-size:13px}
.seg-tabs button.on{background:#fff;color:var(--primary);box-shadow:var(--shadow)}
.plat-card.off{opacity:.55;background:var(--bg)}
.plat-card .plat-name{font-weight:700;font-size:14px}
.plat-card .plat-mode{float:right;font-size:10px;font-weight:600;color:var(--primary);background:var(--primary-light);padding:2px 6px;border-radius:4px}
.plat-card .plat-note{font-size:12px;color:var(--text-3);margin-bottom:6px}
.plat-card button{margin-top:auto}
/* 授权回跳横幅 */
.banner{border-radius:8px;padding:12px 16px;margin-bottom:14px;font-size:13.5px;font-weight:500}
.banner.ok{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}
.banner.err{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.banner.warn{background:#fffbeb;color:#92400e;border:1px solid #fde68a}
.sidebar .plan-box{margin-top:auto;background:var(--primary-light);border-radius:10px;padding:12px}
.plan-box .p-name{font-weight:700;color:var(--primary);font-size:13px;margin-bottom:4px}
.plan-box .p-exp{font-size:12px;color:var(--text-2);line-height:1.5}
.plan-box .p-exp.warn{color:var(--amber)}
.main{flex:1;margin-left:216px;display:flex;flex-direction:column}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
.topbar .page-title{font-size:17px;font-weight:700}
.topbar .user-box{display:flex;align-items:center;gap:12px}
.topbar .user-name{color:var(--text-2);font-size:13px}
.btn-ghost{padding:7px 14px;border-radius:8px;border:1px solid var(--border);color:var(--text-2);font-weight:600;font-size:13px;background:#fff}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
.btn-sm{padding:5px 10px;border-radius:6px;font-size:12px;font-weight:600}
.btn-sm.primary{background:var(--primary-light);color:var(--primary)}
.btn-sm.primary:hover{background:var(--primary);color:#fff}
.btn-sm.danger{background:var(--red-bg);color:var(--red)}
.btn-sm.danger:hover{background:var(--red);color:#fff}
.btn-sm.neutral{background:var(--gray-bg);color:var(--text-2)}
.content{padding:24px;flex:1;max-width:1200px;width:100%}

/* ===== 通用组件 ===== */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.card-head h3{font-size:15px;font-weight:700}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:600;color:var(--text-3);text-align:left;padding:11px 20px;border-bottom:1px solid var(--border);background:#fafbfc;white-space:nowrap}
td{padding:12px 20px;border-bottom:1px solid var(--border);color:var(--text);font-size:13.5px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafbff}
.empty{padding:48px;text-align:center;color:var(--text-3)}
.empty svg{width:44px;height:44px;margin-bottom:12px;opacity:.5}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
.badge.gray{background:var(--gray-bg);color:var(--text-2)}
.badge.blue{background:var(--blue-bg);color:var(--blue)}
.badge.green{background:var(--green-bg);color:var(--green)}
.badge.amber{background:var(--amber-bg);color:var(--amber)}
.badge.red{background:var(--red-bg);color:var(--red)}

/* 概览 */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.stat-card .s-label{font-size:12.5px;color:var(--text-2);font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.stat-card .s-value{font-size:26px;font-weight:800;letter-spacing:-.5px}
.stat-card .s-foot{font-size:12px;color:var(--text-3);margin-top:6px}
.status-row{display:flex;flex-wrap:wrap;gap:12px;padding:18px 20px}
.status-chip{display:flex;align-items:center;gap:8px;background:var(--gray-bg);border-radius:8px;padding:8px 14px;font-size:13px}
.status-chip b{font-size:15px}

/* 弹窗 */
.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:60px 16px;overflow-y:auto}
.modal-mask.show{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:480px;box-shadow:0 24px 60px rgba(15,23,42,.25);animation:pop .18s ease}
.modal.wide{max-width:640px}
@keyframes pop{from{transform:translateY(12px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:16px;font-weight:700}
.modal-close{color:var(--text-3);font-size:20px;line-height:1;padding:4px}
.modal-close:hover{color:var(--text)}
.modal-body{padding:20px 22px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--border)}
.form-row{margin-bottom:14px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-actions{display:flex;justify-content:flex-end;gap:10px}

/* 订单商品行编辑 */
.item-row{display:grid;grid-template-columns:2fr 90px 110px 32px;gap:8px;margin-bottom:8px;align-items:center}
.item-row .del{color:var(--text-3);font-size:18px;padding:6px}
.item-row .del:hover{color:var(--red)}
.add-item-btn{width:100%;border:1px dashed var(--border);border-radius:8px;padding:8px;color:var(--text-3);font-size:13px;margin-top:4px}
.add-item-btn:hover{border-color:var(--primary);color:var(--primary)}
.order-total{display:flex;justify-content:flex-end;gap:20px;padding:12px 22px;background:#fafbfc;border-radius:8px;margin-top:8px;font-size:14px}
.order-total b{font-size:17px;color:var(--primary)}

/* toast */
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast-item{background:#1e293b;color:#fff;padding:10px 20px;border-radius:10px;font-size:13.5px;box-shadow:0 10px 30px rgba(15,23,42,.3);animation:pop .2s ease}
.toast-item.ok{background:var(--green)}
.toast-item.err{background:var(--red)}

/* 通知中心 */
.notif-btn{position:relative;padding:7px 10px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--text-2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.notif-btn:hover{border-color:var(--primary);color:var(--primary)}
.notif-btn svg{width:18px;height:18px;display:block}
.notif-dot{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;padding:0 4px;background:var(--red);color:#fff;border-radius:999px;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff;line-height:1}
.notif-panel{position:absolute;right:0;top:calc(100% + 8px);width:380px;max-height:480px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 16px 40px rgba(15,23,42,.15);z-index:20;display:none;overflow:hidden;flex-direction:column}
.notif-panel.show{display:flex}
.notif-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border)}
.notif-head h4{font-size:13.5px;font-weight:700}
.notif-head a{font-size:12px;color:var(--primary);font-weight:600;cursor:pointer;text-decoration:none}
.notif-list{overflow-y:auto;flex:1}
.notif-item{padding:10px 14px;border-bottom:1px solid #f1f5f9;cursor:pointer;transition:background .1s}
.notif-item:hover{background:#fafbff}
.notif-item.unread{background:var(--primary-light)}
.notif-title{font-size:13.5px;font-weight:600;color:var(--text);margin-bottom:4px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.notif-title .badge{padding:2px 7px;font-size:10px;font-weight:700}
.notif-body{font-size:12.5px;color:var(--text-2);line-height:1.5;margin-bottom:4px}
.notif-meta{font-size:11px;color:var(--text-3);display:flex;justify-content:space-between}
.notif-empty{padding:32px 16px;text-align:center;color:var(--text-3);font-size:13px}

.filter-bar{display:flex;gap:10px;align-items:center}
.filter-bar select{width:140px;padding:8px 10px}

@media (max-width:860px){
  .sidebar{display:none}
  .main{margin-left:0}
  .form-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div id="toast"></div>

<!-- ===== 登录/注册 ===== -->
<div id="login-view">
  <div class="login-card">
    <div class="login-logo"><div class="mark">序</div><div class="name">数序ERP 控制台</div></div>
    <p class="login-sub">一站式跨境电商订单·库存·商品管理系统</p>
    <div class="login-tabs">
      <button id="tab-login" class="on" onclick="switchAuth('login')">登录</button>
      <button id="tab-register" onclick="switchAuth('register')">注册体验</button>
    </div>
    <div class="login-err" id="login-err"></div>
    <form id="login-form" onsubmit="doLogin(event)">
      <div class="login-field"><label>用户名</label><input id="li-username" autocomplete="username" placeholder="请输入用户名" required></div>
      <div class="login-field"><label>密码</label><input id="li-password" type="password" autocomplete="current-password" placeholder="请输入密码" required></div>
      <button class="btn-primary login-submit" type="submit" id="login-btn">登 录</button>
    </form>
    <form id="register-form" style="display:none" onsubmit="doRegister(event)">
      <div class="login-field"><label>公司 / 团队名称</label><input id="rg-company" placeholder="如：某某跨境电商有限公司" required></div>
      <div class="login-field"><label>用户名</label><input id="rg-username" placeholder="3-30 位字母数字下划线" required></div>
      <div class="login-field"><label>密码</label><input id="rg-password" type="password" placeholder="至少 8 位" required></div>
      <button class="btn-primary login-submit" type="submit" id="register-btn">免费开启 14 天体验</button>
    </form>
    <div class="login-trial-note">体验版含 3 店铺 · 500 单/月 · 全功能模块</div>
    <div class="login-back"><a href="/">← 返回官网</a></div>
  </div>
</div>

<!-- ===== 主应用 ===== -->
<div id="app-view">
  <div class="layout">
    <aside class="sidebar">
      <div class="brand"><div class="mark">序</div><div class="name">数序ERP</div></div>
      <a class="nav-item" data-view="dashboard" href="#/dashboard" onclick="go('dashboard')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>概览</a>

      <div class="nav-group">
        <div class="nav-group-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1-5h16l1 5"/><path d="M4 9v11a1 1 0 001 1h14a1 1 0 001-1V9"/><path d="M9 21v-6h6v6"/></svg>店铺中心</div>
        <a class="nav-item sub" data-view="shops" href="#/shops" onclick="go('shops')">店铺授权</a>
        <a class="nav-item sub" data-view="platforms" href="#/platforms" onclick="go('platforms')">平台接入</a>
      </div>

      <div class="nav-group">
        <div class="nav-group-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg>商品中心</div>
        <a class="nav-item sub" data-view="products" href="#/products" onclick="go('products')">商品管理</a>
        <a class="nav-item sub" data-view="inventory" href="#/inventory" onclick="go('inventory')">库存管理</a>
        <a class="nav-item sub" data-view="inventory-ledger" href="#/inventory-ledger" onclick="go('inventory-ledger')">库存流水</a>
      </div>

      <div class="nav-group">
        <div class="nav-group-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>订单中心</div>
        <a class="nav-item sub" data-view="orders" href="#/orders" onclick="go('orders')">订单管理</a>
        <a class="nav-item sub" data-view="shipments" href="#/shipments" onclick="go('shipments')">发货记录</a>
      </div>

      <div class="nav-group">
        <div class="nav-group-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="6" width="15" height="13" rx="1"/><path d="M16 8h4l3 4v7h-7V8z"/><circle cx="5.5" cy="19" r="1.5"/><circle cx="18.5" cy="19" r="1.5"/></svg>供应链</div>
        <a class="nav-item sub" data-view="purchases" href="#/purchases" onclick="go('purchases')">采购单</a>
        <a class="nav-item sub" data-view="suppliers" href="#/suppliers" onclick="go('suppliers')">供应商</a>
        <a class="nav-item sub" data-view="carriers" href="#/carriers" onclick="go('carriers')">物流商</a>
      </div>

      <div class="nav-group" id="nav-finance">
        <div class="nav-group-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>财务中心</div>
        <a class="nav-item sub" data-view="finance" href="#/finance" onclick="go('finance')">订单利润</a>
        <a class="nav-item sub" data-view="finance-report" href="#/finance-report" onclick="go('finance-report')">经营报表</a>
      </div>

      <div class="nav-group">
        <div class="nav-group-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>系统设置</div>
        <a class="nav-item sub" data-view="audit-logs" href="#/audit-logs" onclick="go('audit-logs')">审计日志</a>
        <a class="nav-item sub" data-view="settings" href="#/settings" onclick="go('settings')">账户设置</a>
      </div>

      <div class="plan-box" id="plan-box"></div>
    </aside>
    <div class="main">
      <div class="topbar">
        <div class="page-title" id="page-title">概览</div>
        <div class="user-box">
          <div class="notif-btn" id="notif-btn" onclick="toggleNotif()" title="通知公告">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
            <span class="notif-dot" id="notif-dot" style="display:none">0</span>
            <div class="notif-panel" id="notif-panel" onclick="event.stopPropagation()">
              <div class="notif-head"><h4>通知公告</h4><a onclick="readAllNotif()">全部已读</a></div>
              <div class="notif-list" id="notif-list"></div>
            </div>
          </div>
          <span class="user-name" id="user-name"></span>
          <button class="btn-ghost" onclick="logout()">退出登录</button>
        </div>
      </div>
      <div class="content" id="content"></div>
    </div>
  </div>
</div>

<!-- ===== 通用弹窗 ===== -->
<div class="modal-mask" id="modal-mask" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-box">
    <div class="modal-head"><h3 id="modal-title"></h3><button class="modal-close" onclick="closeModal()">×</button></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>
</div>

<script>
/* ================= 基础设施 ================= */
let token = localStorage.getItem('sx_token') || '';
let me = null, tenant = null;
let productsCache = [], shopsCache = [];

const STATUS_LABEL = { PENDING:'待付款', PAID:'已付款', SHIPPED:'已发货', COMPLETED:'已完成', CANCELLED:'已取消' };
const STATUS_CLASS = { PENDING:'amber', PAID:'blue', SHIPPED:'blue', COMPLETED:'green', CANCELLED:'red' };
// 共 68 个平台（覆盖北美/欧洲/东南亚/南亚/日韩/中东/非/拉美/澳新/国内独立站）
const PLATFORMS = [
  'Amazon','Newegg','Etsy','Wish','Houzz','Overstock','Target','Home Depot','Costco','Best Buy',"Kohl's",'Walmart','eBay',
  'Allegro','Zalando','Cdiscount','Fnac','Darty','ManoMano','Back Market','Bol.com','Coolblue','MediaMarkt','Saturn','CDON','Elgiganten','eMag','Fruugo','OnBuy','Kaufland','OZON','Wildberries',
  'Shopee','Lazada','TikTok Shop','AliExpress','Temu','SHEIN','Coupang','Qoo10','Daraz','Sendo','Tiki','JD.ID',
  'Flipkart','Meesho',
  'Rakuten','Yahoo! Shopping','PayPay Mall','Gmarket','11st',
  'Noon','Namshi','Souq',
  'Jumia','Kilimall',
  'Mercado Libre','Magazine Luiza','B2W','Dafiti','Linio',
  'Catch','Kogan','MyDeal','Trade Me',
  'Douyin','Shopify','Shoplazza','Shopline','独立站'
];
// 常用币种（店铺结算币种，订单按此折算 CNY）
const CURRENCIES = ['CNY','USD','EUR','GBP','JPY','KRW','SGD','MYR','THB','VND','IDR','PHP','TWD','BRL','MXN','RUB','PLN','AUD','CAD','HKD','TRY','AED','SAR','INR'];
const VIEW_TITLES = { dashboard:'概览', shops:'店铺授权', platforms:'平台接入', products:'商品管理', inventory:'库存管理', 'inventory-ledger':'库存流水', orders:'订单管理', shipments:'发货记录', purchases:'采购单', suppliers:'供应商', carriers:'物流商', finance:'订单利润', 'finance-report':'月度报表', 'audit-logs':'审计日志', settings:'账户设置' };

function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast-item ' + (type || '');
  el.textContent = msg;
  document.getElementById('toast').appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

async function api(path, method, body) {
  const res = await fetch('/api/v1' + path, {
    method: method || 'GET',
    headers: {
      'Content-Type': 'application/json',
      ...(token ? { Authorization: 'Bearer ' + token } : {})
    },
    body: body ? JSON.stringify(body) : undefined
  });
  let data = {};
  try { data = await res.json(); } catch {}
  if (res.status === 401) { logout(true); throw new Error(data.error || '请重新登录'); }
  if (!res.ok) throw new Error(data.error || '请求失败');
  return data;
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtMoney(n) { return '¥' + Number(n || 0).toFixed(2); }
function fmtDate(s) { return s ? String(s).slice(0, 16).replace('T', ' ') : '-'; }

/* ================= 认证 ================= */
function switchAuth(which) {
  document.getElementById('tab-login').classList.toggle('on', which === 'login');
  document.getElementById('tab-register').classList.toggle('on', which === 'register');
  document.getElementById('login-form').style.display = which === 'login' ? '' : 'none';
  document.getElementById('register-form').style.display = which === 'register' ? '' : 'none';
  hideErr();
}
function showErr(msg) { const e = document.getElementById('login-err'); e.textContent = msg; e.style.display = 'block'; }
function hideErr() { document.getElementById('login-err').style.display = 'none'; }

async function doLogin(ev) {
  ev.preventDefault(); hideErr();
  const btn = document.getElementById('login-btn'); btn.disabled = true; btn.textContent = '登录中…';
  try {
    const r = await api('/auth/login', 'POST', {
      username: document.getElementById('li-username').value.trim(),
      password: document.getElementById('li-password').value
    });
    afterAuth(r);
  } catch (e) { showErr(e.message); }
  btn.disabled = false; btn.textContent = '登 录';
}

async function doRegister(ev) {
  ev.preventDefault(); hideErr();
  const btn = document.getElementById('register-btn'); btn.disabled = true; btn.textContent = '创建中…';
  try {
    const r = await api('/auth/register', 'POST', {
      company: document.getElementById('rg-company').value.trim(),
      username: document.getElementById('rg-username').value.trim(),
      password: document.getElementById('rg-password').value
    });
    afterAuth(r);
    toast('注册成功，体验期 14 天', 'ok');
  } catch (e) { showErr(e.message); }
  btn.disabled = false; btn.textContent = '免费开启 14 天体验';
}

function afterAuth(r) {
  token = r.token; me = r.user; tenant = r.tenant;
  localStorage.setItem('sx_token', token);
  enterApp();
}

function logout(silent) {
  token = ''; me = null; tenant = null;
  localStorage.removeItem('sx_token');
  document.getElementById('app-view').style.display = 'none';
  document.getElementById('login-view').style.display = 'flex';
  if (!silent) toast('已退出登录');
}

async function enterApp() {
  document.getElementById('login-view').style.display = 'none';
  document.getElementById('app-view').style.display = 'block';
  document.getElementById('user-name').textContent = (tenant ? tenant.name + ' · ' : '') + (me ? me.username : '');
  // 角色权限：非 owner（staff/viewer）隐藏财务中心，viewer 再隐藏写操作入口
  const finNav = document.getElementById('nav-finance');
  if (finNav) finNav.style.display = (me && me.role !== 'owner') ? 'none' : '';
  renderPlanBox();
  // 通知中心初始化 + 每 30s 轮询
  try { await loadNotifBadge(); } catch {}
  if (!window.__notifTimer) window.__notifTimer = setInterval(loadNotifBadge, 30000);
  go(location.hash.replace('#/', '') || 'dashboard');
}

function renderPlanBox() {
  if (!tenant) return;
  const expired = tenant.expired;
  document.getElementById('plan-box').innerHTML = `
    <div class="p-name">${esc(tenant.planName)}</div>
    <div class="p-exp ${expired ? 'warn' : ''}">${expired ? '已到期，续费后恢复使用' : '有效期至 ' + fmtDate(tenant.expire_at)}</div>`;
}

/* ================= 路由 ================= */
function go(view) {
  view = String(view || '').split('?')[0];
  if (!VIEW_TITLES[view]) view = 'dashboard';
  // 仅当停留在同一视图时保留 URL 查询参数（OAuth 回跳提示用）
  const cur = String(location.hash.replace('#/', '')).split('?')[0];
  const q = (cur === view && location.hash.includes('?')) ? '?' + location.hash.split('?')[1] : '';
  location.hash = '#/' + view + q;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('on', n.dataset.view === view));
  document.getElementById('page-title').textContent = VIEW_TITLES[view];
  const loaders = { dashboard: loadDashboard, orders: loadOrders, products: loadProducts, inventory: loadInventory, 'inventory-ledger': loadInventoryLedger, shops: loadShops, platforms: loadPlatforms, shipments: loadShipments, purchases: loadPurchases, suppliers: loadSuppliers, carriers: loadCarriers, finance: loadFinance, 'finance-report': loadFinanceReport, 'audit-logs': loadAuditLogs, settings: loadSettings };
  loaders[view]();
}
window.addEventListener('hashchange', () => {
  const v = location.hash.replace('#/', '');
  if (token && VIEW_TITLES[String(v).split('?')[0]]) go(v);
});

/* ================= 概览 ================= */
async function loadDashboard() {
  const d = await api('/stats/dashboard');
  const st = {}; (d.ordersByStatus || []).forEach(s => st[s.status] = s.c);
  const quota = d.planQuota || {};
  document.getElementById('content').innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="s-label">今日新增订单</div><div class="s-value">${d.todayOrders}</div><div class="s-foot">本月累计 ${d.monthOrders}${quota.monthlyOrders ? ' / 上限 ' + quota.monthlyOrders : ' / 不限量'}</div></div>
      <div class="stat-card"><div class="s-label">本月销售额</div><div class="s-value">${fmtMoney(d.monthSales)}</div><div class="s-foot">不含已取消订单</div></div>
      <div class="stat-card"><div class="s-label">在库总量</div><div class="s-value">${d.stockQty}</div><div class="s-foot">订单占用 ${d.reservedQty}</div></div>
      <div class="stat-card"><div class="s-label">商品 / 店铺</div><div class="s-value">${d.productCount} / ${d.shopCount}</div><div class="s-foot">店铺上限 ${quota.shops === Infinity ? '不限' : quota.shops}</div></div>
    </div>
    <div class="card">
      <div class="card-head"><h3>订单状态分布</h3></div>
      <div class="status-row">
        ${['PENDING','PAID','SHIPPED','COMPLETED','CANCELLED'].map(s =>
          `<div class="status-chip"><span class="badge ${STATUS_CLASS[s]}">${STATUS_LABEL[s]}</span><b>${st[s] || 0}</b></div>`).join('')}
      </div>
    </div>`;
}

/* ================= 商品 ================= */
async function loadProducts() {
  const r = await api('/products');
  productsCache = r.items;
  document.getElementById('content').innerHTML = `
    <div class="card">
      <div class="card-head"><h3>商品列表（${r.items.length}）</h3>
        <div style="display:flex;gap:8px">
          <button class="btn-ghost btn-sm" onclick="syncProductsForm()">⟳ 从平台同步 Listing</button>
          <button class="btn-primary btn-sm" onclick="productForm()">+ 新增商品</button>
        </div></div>
      <div class="table-wrap"><table>
        <thead><tr><th>SKU</th><th>商品名称</th><th>类目</th><th>售价</th><th>成本</th><th>在库</th><th>占用</th><th>可用</th><th>操作</th></tr></thead>
        <tbody>${r.items.length ? r.items.map(p => `
          <tr>
            <td><b>${esc(p.sku)}</b></td><td>${esc(p.name)}</td><td>${esc(p.category) || '-'}</td>
            <td>${fmtMoney(p.price)}</td><td>${fmtMoney(p.cost)}</td>
            <td>${p.qty_on_hand || 0}</td><td>${p.qty_reserved || 0}</td><td><b>${p.qty_available || 0}</b></td>
            <td style="white-space:nowrap">
              <button class="btn-sm primary" onclick="productForm(${p.id})">编辑</button>
              <button class="btn-sm danger" onclick="delProduct(${p.id}, '${esc(p.sku)}')">删除</button>
            </td>
          </tr>`).join('') : `<tr><td colspan="9"><div class="empty">暂无商品，点击右上角「新增商品」开始</div></td></tr>`}
        </tbody></table></div>
    </div>`;
}

function productForm(id) {
  const p = id ? productsCache.find(x => x.id === id) : null;
  openModal(p ? '编辑商品' : '新增商品', `
    <div class="form-grid">
      <div class="form-row"><label>SKU *</label><input id="pf-sku" value="${esc(p ? p.sku : '')}" placeholder="唯一编码"></div>
      <div class="form-row"><label>类目</label><input id="pf-cat" value="${esc(p ? p.category : '')}" placeholder="如：Home & Kitchen"></div>
    </div>
    <div class="form-row"><label>商品名称 *</label><input id="pf-name" value="${esc(p ? p.name : '')}" placeholder="商品标题"></div>
    <div class="form-grid">
      <div class="form-row"><label>售价（¥）</label><input id="pf-price" type="number" step="0.01" min="0" value="${p ? p.price : ''}"></div>
      <div class="form-row"><label>成本（¥）</label><input id="pf-cost" type="number" step="0.01" min="0" value="${p ? p.cost : ''}"></div>
    </div>`,
    `<button class="btn-ghost" onclick="closeModal()">取消</button>
     <button class="btn-primary" onclick="saveProduct(${id || 0})">保存</button>`);
}

async function saveProduct(id) {
  try {
    const body = {
      sku: document.getElementById('pf-sku').value.trim(),
      name: document.getElementById('pf-name').value.trim(),
      category: document.getElementById('pf-cat').value.trim() || null,
      price: Number(document.getElementById('pf-price').value) || 0,
      cost: Number(document.getElementById('pf-cost').value) || 0
    };
    if (!body.sku || !body.name) return toast('SKU 与名称必填', 'err');
    await api('/products' + (id ? '/' + id : ''), id ? 'PATCH' : 'POST', body);
    closeModal(); toast(id ? '商品已更新' : '商品已创建', 'ok');
    loadProducts();
  } catch (e) { toast(e.message, 'err'); }
}

async function delProduct(id, sku) {
  if (!confirm(`确定删除商品「${sku}」？仅可删除无库存商品。`)) return;
  try { await api('/products/' + id, 'DELETE'); toast('已删除', 'ok'); loadProducts(); }
  catch (e) { toast(e.message, 'err'); }
}

/** 从平台同步商品 Listing：选择已授权店铺 */
async function syncProductsForm() {
  try {
    const r = await api('/products/syncable-shops');
    if (!r.items.length) return toast('暂无可同步的授权店铺（需 OAuth 在线授权且令牌有效）', 'err');
    const opts = r.items.map(s => `<option value="${s.id}">${esc(s.platform)} · ${esc(s.name)}（${esc(s.currency)}）</option>`).join('');
    openModal('从平台同步商品 Listing', `
      <div class="form-row"><label>选择授权店铺</label><select id="spf-shop">${opts}</select></div>
      <p style="font-size:12px;color:var(--text-3);margin-top:10px">拉取店铺在售商品（Shopee / TikTok Shop 支持真实 API），自动导入本地商品库：已存在的 SKU 更新名称与价格，新商品初始化库存为 0。</p>`,
      `<button class="btn-ghost" onclick="closeModal()">取消</button>
       <button class="btn-primary" onclick="doSyncProducts()">开始同步</button>`);
  } catch (e) { toast(e.message, 'err'); }
}

async function doSyncProducts() {
  const shopId = document.getElementById('spf-shop').value;
  closeModal();
  toast('正在拉取平台商品…');
  try {
    const r = await api('/products/sync/' + shopId, 'POST');
    toast(`同步完成：拉取 ${r.total} 个，新建 ${r.created}，更新 ${r.updated}`, 'ok');
    loadProducts();
  } catch (e) { toast(e.message, 'err'); }
}

/* ================= 库存 ================= */
async function loadInventory() {
  const r = await api('/inventory');
  document.getElementById('content').innerHTML = `
    <div class="card">
      <div class="card-head"><h3>库存总览（MAIN 主仓）</h3></div>
      <div class="table-wrap"><table>
        <thead><tr><th>SKU</th><th>商品名称</th><th>在库数量</th><th>订单占用</th><th>可用数量</th><th>更新时间</th><th>操作</th></tr></thead>
        <tbody>${r.items.length ? r.items.map(i => `
          <tr>
            <td><b>${esc(i.sku)}</b></td><td>${esc(i.name)}</td>
            <td>${i.qty_on_hand}</td><td>${i.qty_reserved}</td><td><b>${i.qty_available}</b></td>
            <td>${fmtDate(i.updated_at)}</td>
            <td style="white-space:nowrap">
              <button class="btn-sm primary" onclick="adjustForm(${i.product_id}, '${esc(i.sku)}', 'IN')">入库</button>
              <button class="btn-sm neutral" onclick="adjustForm(${i.product_id}, '${esc(i.sku)}', 'OUT')">出库</button>
            </td>
          </tr>`).join('') : `<tr><td colspan="7"><div class="empty">暂无库存记录，请先在「商品管理」新增商品</div></td></tr>`}
        </tbody></table></div>
    </div>`;
}

function adjustForm(pid, sku, type) {
  openModal(type === 'IN' ? '库存入库' : '库存出库', `
    <p style="color:var(--text-2);margin-bottom:14px">商品：<b>${esc(sku)}</b></p>
    <div class="form-row"><label>${type === 'IN' ? '入库数量' : '出库数量'} *</label>
      <input id="adj-qty" type="number" min="1" step="1" placeholder="正整数"></div>`,
    `<button class="btn-ghost" onclick="closeModal()">取消</button>
     <button class="btn-primary" onclick="doAdjust(${pid}, '${type}')">确认${type === 'IN' ? '入库' : '出库'}</button>`);
}

async function doAdjust(pid, type) {
  try {
    const qty = parseInt(document.getElementById('adj-qty').value, 10);
    if (!qty || qty <= 0) return toast('请输入正整数数量', 'err');
    await api('/inventory/adjust', 'POST', { product_id: pid, type, qty });
    closeModal(); toast(type === 'IN' ? '入库成功' : '出库成功', 'ok');
    loadInventory();
  } catch (e) { toast(e.message, 'err'); }
}

/* ================= 订单 ================= */
async function loadOrders(filter) {
  const qs = filter && filter !== 'ALL' ? '?status=' + filter : '';
  const [ro, rp] = await Promise.all([api('/orders' + qs), api('/products')]);
  shopsCache = await api('/shops').then(r => r.items).catch(() => []);
  productsCache = rp.items;
  const orders = ro.items;
  document.getElementById('content').innerHTML = `
    <div class="card">
      <div class="card-head"><h3>订单列表（${orders.length}）</h3>
        <div style="display:flex;gap:10px;align-items:center">
          <select onchange="loadOrders(this.value)" style="padding:8px 10px;border:1px solid var(--border);border-radius:8px">
            ${['ALL','PENDING','PAID','SHIPPED','COMPLETED','CANCELLED'].map(s =>
              `<option value="${s}" ${filter === s || (!filter && s === 'ALL') ? 'selected' : ''}>${s === 'ALL' ? '全部状态' : STATUS_LABEL[s]}</option>`).join('')}
          </select>
          <button class="btn-primary btn-sm" onclick="orderForm()">+ 新建订单</button>
        </div>
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>订单号</th><th>店铺</th><th>买家</th><th>金额</th><th>状态</th><th>物流</th><th>创建时间</th><th>操作</th></tr></thead>
        <tbody>${orders.length ? orders.map(o => `
          <tr>
            <td><b>${esc(o.order_no)}</b></td><td>${esc(o.shop_name) || '-'}</td>
            <td>${esc(o.buyer_name) || '-'}</td><td>${fmtMoney(o.total_amount)}</td>
            <td><span class="badge ${STATUS_CLASS[o.status]}">${STATUS_LABEL[o.status]}</span></td>
            <td>${o.carrier_name ? esc(o.carrier_name) + (o.tracking_no ? '<br><span style="color:var(--text-3);font-size:12px">' + esc(o.tracking_no) + '</span>' : '') : '-'}</td>
            <td style="white-space:nowrap">${fmtDate(o.created_at)}</td>
            <td style="white-space:nowrap">${orderActions(o)}</td>
          </tr>`).join('') : `<tr><td colspan="8"><div class="empty">暂无订单，点击「新建订单」创建第一单</div></td></tr>`}
        </tbody></table></div>
    </div>`;
}

function orderActions(o) {
  const btns = [];
  if (o.status === 'PENDING') {
    btns.push(`<button class="btn-sm primary" onclick="orderStatus(${o.id},'pay')">收款</button>`);
    btns.push(`<button class="btn-sm danger" onclick="orderStatus(${o.id},'cancel')">取消</button>`);
  } else if (o.status === 'PAID') {
    btns.push(`<button class="btn-sm primary" onclick="shipForm(${o.id}, '${esc(o.order_no)}')">发货</button>`);
    btns.push(`<button class="btn-sm danger" onclick="orderStatus(${o.id},'cancel')">取消</button>`);
  } else if (o.status === 'SHIPPED') {
    btns.push(`<button class="btn-sm primary" onclick="orderStatus(${o.id},'complete')">完成</button>`);
  }
  return btns.join(' ') || '<span style="color:var(--text-3)">—</span>';
}

async function orderStatus(id, action) {
  const names = { pay: '确认收款', complete: '标记完成', cancel: '取消订单（释放占用库存）' };
  if (!confirm(`确定执行「${names[action]}」？`)) return;
  try {
    await api(`/orders/${id}/status`, 'POST', { action });
    toast('操作成功', 'ok');
    loadOrders();
  } catch (e) { toast(e.message, 'err'); }
}

/* 发货弹窗：选择物流商 + 运单号 + 运费 */
async function shipForm(orderId, orderNo) {
  const rc = await api('/carriers');
  const carriers = rc.items.filter(c => c.status === 'active');
  if (!carriers.length) return toast('请先在「物流管理」添加物流商', 'err');
  const opts = carriers.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
  openModal(`订单发货 · ${orderNo}`, `
    <div class="form-row"><label>物流商 *</label>
      <select id="sf-carrier">${opts}</select></div>
    <div class="form-row"><label>运单号</label><input id="sf-tracking" placeholder="物流商提供的追踪号"></div>
    <div class="form-row"><label>运费（¥）</label>
      <input id="sf-cost" type="number" step="0.01" min="0" value="0">
      <p style="font-size:12px;color:var(--text-3);margin-top:6px">运费将计入该订单利润核算</p></div>`,
    `<button class="btn-ghost" onclick="closeModal()">取消</button>
     <button class="btn-primary" onclick="doShip(${orderId})">确认发货（扣减库存）</button>`);
}

async function doShip(orderId) {
  try {
    const carrierId = Number(document.getElementById('sf-carrier').value);
    await api(`/orders/${orderId}/status`, 'POST', {
      action: 'ship',
      carrier_id: carrierId,
      tracking_no: document.getElementById('sf-tracking').value.trim() || null,
      shipping_cost: Number(document.getElementById('sf-cost').value) || 0
    });
    closeModal(); toast('发货成功，库存已扣减', 'ok');
    loadOrders();
  } catch (e) { toast(e.message, 'err'); }
}

function orderForm() {
  if (!productsCache.length) return toast('请先在「商品管理」新增商品', 'err');
  const shopOpts = shopsCache.map(s => `<option value="${s.id}">${esc(s.name)}（${esc(s.platform)}）</option>`).join('');
  openModal('新建订单', `
    <div class="form-grid">
      <div class="form-row"><label>店铺</label><select id="of-shop"><option value="">不关联</option>${shopOpts}</select></div>
      <div class="form-row"><label>国家/地区</label><input id="of-country" placeholder="如 US / DE / SG"></div>
    </div>
    <div class="form-row"><label>买家名称</label><input id="of-buyer" placeholder="如 John Smith"></div>
    <div class="form-row"><label>商品明细 *</label><div id="of-items"></div>
      <button class="add-item-btn" onclick="addOrderItem()">+ 添加商品行</button></div>`,
    `<button class="btn-ghost" onclick="closeModal()">取消</button>
     <button class="btn-primary" onclick="saveOrder()">创建订单（预占库存）</button>`, true);
  addOrderItem();
}

function addOrderItem() {
  const opts = productsCache.map(p => `<option value="${p.id}" data-price="${p.price}">${esc(p.sku)} · ${esc(p.name)}（可用 ${p.qty_available || 0}）</option>`).join('');
  const div = document.createElement('div');
  div.className = 'item-row';
  div.innerHTML = `
    <select class="it-prod" onchange="calcOrderTotal()">${opts}</select>
    <input class="it-qty" type="number" min="1" value="1" oninput="calcOrderTotal()">
    <input class="it-price" type="number" step="0.01" min="0" placeholder="单价" oninput="calcOrderTotal()">
    <button class="del" onclick="this.parentElement.remove();calcOrderTotal()">×</button>`;
  document.getElementById('of-items').appendChild(div);
  const sel = div.querySelector('.it-prod');
  div.querySelector('.it-price').value = sel.selectedOptions[0]?.dataset.price || 0;
  calcOrderTotal();
}

function calcOrderTotal() {
  let total = 0, box = document.getElementById('order-total');
  document.querySelectorAll('.item-row').forEach(r => {
    const qty = Number(r.querySelector('.it-qty').value) || 0;
    const price = Number(r.querySelector('.it-price').value) || 0;
    total += qty * price;
  });
  if (!box) {
    box = document.createElement('div');
    box.className = 'order-total'; box.id = 'order-total';
    document.getElementById('modal-body').appendChild(box);
  }
  box.innerHTML = `<span>订单合计</span><span><b>${fmtMoney(total)}</b></span>`;
}

async function saveOrder() {
  try {
    const items = [];
    document.querySelectorAll('.item-row').forEach(r => {
      const pid = Number(r.querySelector('.it-prod').value);
      const qty = parseInt(r.querySelector('.it-qty').value, 10);
      const price = Number(r.querySelector('.it-price').value) || 0;
      if (pid && qty > 0) items.push({ product_id: pid, qty, unit_price: price });
    });
    if (!items.length) return toast('请至少添加一个商品行', 'err');
    await api('/orders', 'POST', {
      shop_id: Number(document.getElementById('of-shop').value) || null,
      buyer_name: document.getElementById('of-buyer').value.trim() || null,
      country: document.getElementById('of-country').value.trim() || null,
      items
    });
    closeModal(); toast('订单已创建，库存已预占', 'ok');
    loadOrders();
  } catch (e) { toast(e.message, 'err'); }
}

/* ================= 店铺（授权中心） ================= */
let oauthPlatforms = [];
let authTab = 'auto'; // 'auto'=自动授权 | 'manual'=手动录入

function switchAuthTab(t) {
  authTab = t;
  document.querySelectorAll('.seg-tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  document.getElementById('auth-auto').style.display = t === 'auto' ? '' : 'none';
  document.getElementById('auth-manual').style.display = t === 'manual' ? '' : 'none';
}

async function loadShops() {
  const [r, st] = await Promise.all([api('/shops'), api('/oauth/status')]);

  // OAuth 回跳提示

    <div class="plat-card ${p.configured ? '' : 'off'}" title="${esc(p.where || '')}">

    </div>`;
    }
    // OAuth 跳转型 / 域名型
    return `
    <div class="plat-card ${p.configured ? '' : 'off'}">
      <div class="plat-name">${esc(p.platform)}<span class="plat-mode">OAuth</span></div>
      <div class="plat-note">${p.configured ? esc(st) : '待运营商配置'}</div>
      ${p.configured
        ? `<button class="btn-primary btn-sm" onclick="${p.needShop ? `shopDomainForm('${esc(p.platform)}')` : `goOauth('${esc(p.platform)}')`}">${p.needShop ? '输域名后授权' : '去官方授权'}</button>`
        : `<button class="btn-sm neutral" onclick="toast('该平台开发者应用尚未配置，详见「平台接入」页', 'err')">暂不可用</button>`}

    ${authNote}
    <div class="card">
      <div class="seg-tabs">
        <button data-tab="auto" class="${authTab === 'auto' ? 'on' : ''}" onclick="switchAuthTab('auto')">自动授权（${oauthCount + keyCount} 平台）</button>
        <button data-tab="manual" class="${authTab === 'manual' ? 'on' : ''}" onclick="switchAuthTab('manual')">手动录入</button>
      </div>

      <div id="auth-auto" style="${authTab === 'auto' ? '' : 'display:none'}">
        <div class="card-head" style="margin-bottom:10px"><h3>自动授权（${oauthCount} 个在线授权 + ${keyCount} 个密钥接入）</h3></div>
        <div class="plat-grid">${cards}</div>
        <p style="color:var(--text-3);font-size:12px;margin-top:10px">「OAuth」平台跳转平台官方页面授权，令牌自动保存（AES-256 加密）；「密钥」平台在商家后台生成 API 密钥后录入，密钥加密存储。</p>
      </div>

      <div id="auth-manual" style="${authTab === 'manual' ? '' : 'display:none'}">
        <div class="banner warn" style="margin-bottom:14px">
          <b>注意：</b>「手动录入」只用于<b>登记店铺归属</b>（方便后续订单导入、利润核算），<b>不提供自动同步订单/商品能力</b>。<br>
          如需自动拉取平台订单，请切换到上方「自动授权」卡片：OAuth 平台点「去官方授权」，密钥平台点「录入 API 密钥」接入。
        </div>
        <div class="card-head" style="margin-bottom:10px"><h3>手动录入店铺（仅登记，不同步）</h3></div>
        <div class="form-grid">
          <div class="form-row"><label>店铺名称 *</label><input id="mf-name" placeholder="如：US-旗舰店（至少 2 个字，同平台不可重名）"></div>
          <div class="form-row"><label>平台 *</label>
            <select id="mf-platform">${PLATFORMS.map(p => `<option>${p}</option>`).join('')}</select></div>
          <div class="form-row"><label>结算币种</label>
            <select id="mf-currency">${CURRENCIES.map(c => `<option${c === 'CNY' ? ' selected' : ''}>${c}</option>`).join('')}</select>
            <p style="font-size:12px;color:var(--text-3);margin-top:6px">订单金额按此币种记录并折算 CNY</p></div>
          <div class="form-row"><label>平台佣金率（%）</label>
            <input id="mf-rate" type="number" min="0" max="50" step="0.5" value="0" placeholder="如 8.5">
            <p style="font-size:12px;color:var(--text-3);margin-top:6px">用于订单利润核算</p></div>

        <div style="display:flex;align-items:center;gap:12px;margin-top:6px">

          <span style="font-size:12px;color:var(--text-3)">如需要自动订单同步，请走「自动授权」</span>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-head"><h3>已接入店铺（${r.items.length}）</h3></div>
      <div class="table-wrap"><table>
        <thead><tr><th>店铺名称</th><th>平台</th><th>币种</th><th>授权状态</th><th>令牌到期</th><th>最近同步</th><th>订单</th><th>操作</th></tr></thead>
        <tbody>${r.items.length ? r.items.map(s => `
          <tr>
            <td><b>${esc(s.name)}</b>${s.ext_shop_id ? `<div style="font-size:11px;color:var(--text-3)">ID: ${esc(String(s.ext_shop_id))}</div>` : ''}</td>
            <td>${esc(s.platform)}</td>
            <td>${esc(s.currency || 'CNY')}</td>
            <td>${authBadge(s.effective_auth)}</td>
            <td>${s.token_expires_at ? fmtDate(s.token_expires_at) : '-'}</td>
            <td>${s.last_sync_at ? fmtDate(s.last_sync_at) : '-'}</td>
            <td>${s.order_count}</td>
            <td style="white-space:nowrap">
              ${(s.has_token || s.has_apikey) ? `<button class="btn-sm neutral" onclick="syncShop(${s.id})">同步订单</button>` : ''}
              ${s.has_token ? `<button class="btn-sm neutral" onclick="refreshToken(${s.id})">刷新令牌</button>` : ''}
              ${(s.has_token || s.has_apikey) ? `<button class="btn-sm danger" onclick="unlinkShop(${s.id})">解除授权</button>` : ''}
              <button class="btn-sm neutral" onclick="toggleShop(${s.id}, '${s.status}')">${s.status === 'active' ? '停用' : '启用'}</button>

            </td>
          </tr>`).join('') : `<tr><td colspan="8"><div class="empty">暂无店铺：切换到「自动授权」在线接入，或「手动录入」登记店铺</div></td></tr>`}

    </div>
    ${await syncLogsCard()}`;
}

/** 同步日志卡片（手动 + 后台定时同步） */
async function syncLogsCard() {
  let logs = [];
  try { logs = (await api('/oauth/logs')).items || []; } catch { return ''; }
  if (!logs.length) return `
    <div class="card">
      <div class="card-head"><h3>同步日志</h3><span style="font-size:12px;color:var(--text-3)">系统每 30 分钟自动同步已授权店铺订单</span></div>
      <div class="empty">暂无同步记录：在线授权店铺后，手动点「同步订单」或等待后台定时同步</div>
    </div>`;
  const badge = l => l.status === 'ok' || l.status === 'auto'
    ? `<span class="tag green">成功</span>` : `<span class="tag red">失败</span>`;
  return `
    <div class="card">
      <div class="card-head"><h3>同步日志（最近 ${logs.length} 条）</h3><span style="font-size:12px;color:var(--text-3)">系统每 30 分钟自动同步已授权店铺订单</span></div>
      <div class="table-wrap"><table>
        <thead><tr><th>时间</th><th>店铺</th><th>平台</th><th>类型</th><th>结果</th><th>说明</th></tr></thead>
        <tbody>${logs.map(l => `
          <tr>
            <td>${fmtDate(l.created_at)}</td>
            <td>${esc(l.shop_name || '-')}</td>
            <td>${esc(l.platform || '-')}</td>
            <td>${l.type === 'orders' ? '订单' : l.type === 'products' ? '商品' : l.type === 'auth' ? '授权' : l.type}</td>
            <td>${l.status === 'auto' ? '<span class="tag blue">定时</span>' : badge(l)}</td>
            <td>${esc(l.message || '')}</td>
          </tr>`).join('')}
        </tbody></table></div>
    </div>`;
}

/** 自动授权：先取授权地址（携带令牌）再跳转平台官方页，避免直跳丢鉴权 */
async function goOauth(platform) {
  try {
    const r = await api('/oauth/authorize-url/' + encodeURIComponent(platform));
    if (r.url) location.href = r.url;
  } catch (e) { toast(e.message, 'err'); }
}

/** 手动录入：保存店铺（增加 loading + 空值/短值拦截 + 重复校验） */
async function saveManualShop(btn) {
  try {
    const name = document.getElementById('mf-name').value.trim();
    const platform = document.getElementById('mf-platform').value;
    if (!name) return toast('请填写店铺名称', 'err');
    if (name.length < 2) return toast('店铺名称至少 2 个字', 'err');
    if (!platform) return toast('请选择平台', 'err');
    if (!PLATFORMS.includes(platform)) return toast(`「${platform}」不在平台列表，请联系运营商开通`, 'err');
    // 防重复：本地先扫 shopsCache，避免浪费请求
    if (shopsCache.some(s => s.platform === platform && (s.name || '').trim() === name)) {
      return toast('该平台下已存在同名店铺，请勿重复录入', 'err');
    }
    const rate = Number(document.getElementById('mf-rate').value) || 0;
    const currency = document.getElementById('mf-currency').value;
    if (btn) { btn.disabled = true; btn.textContent = '保存中…'; }
    await api('/shops', 'POST', { name, platform, commission_rate: rate / 100, currency });
    toast('店铺已录入（仅登记，不可自动同步）', 'ok');
    loadShops();
  } catch (e) {
    toast(e.message, 'err');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '保存店铺（仅登记）'; }
  }
}

function authBadge(st) {
  if (st === 'authorized') return '<span class="badge green">已授权</span>';
  if (st === 'expired') return '<span class="badge red">令牌过期</span>';
  return '<span class="badge gray">手动录入</span>';
}

/** 密钥型平台：录入 API 密钥弹窗（必填 + 最小长度 + 提交后探活失败不 closeModal） */
function apikeyForm(platform) {
  const p = oauthPlatforms.find(x => x.platform === platform);
  if (!p || !p.fields) return;
  const fields = p.fields.map(f => `
    <div class="form-row"><label>${esc(f.label)} *（不能为空，至少 4 位）</label>
      <input id="akf-${f.key}" autocomplete="off" placeholder="从 ${esc(p.where || '平台后台')} 获取后复制粘贴，不要手输" style="font-family:ui-monospace,Consolas,monospace"></div>`).join('');
  openModal(`接入 ${esc(p.name || platform)}（API 密钥）`, `
    <div class="banner warn" style="margin-bottom:12px;font-size:12px">
      <b>凭证请务必真实：</b>系统保存前会调用该平台接口做一次探活校验，假值/占位符/手输乱码会直接被拒绝。
    </div>
    <div class="form-row"><label>店铺备注名（可选）</label><input id="akf-name" placeholder="如：${esc(platform)} 主店"></div>
    ${fields}
    <p style="font-size:12px;color:var(--text-3);margin-top:10px">密钥获取路径：${esc(p.where || '')}
      ${p.portal ? `（<a href="${esc(p.portal)}" target="_blank" rel="noopener">${esc(p.portal.replace('https://', ''))} ↗</a>）` : ''}<br>
      密钥将以 AES-256 加密存储，数据库与页面均不显示明文。探活通过后才会写入店铺。</p>`,
    `<button class="btn-ghost" onclick="closeModal()">取消</button>
     <button class="btn-primary" id="akf-save" onclick="saveApikey(this, '${esc(platform)}')">校验并保存密钥</button>`);
}

async function saveApikey(btn, platform) {
  try {
    const p = oauthPlatforms.find(x => x.platform === platform);
    const body = { shop_name: document.getElementById('akf-name').value.trim() };
    let missing = null, tooShort = null;
    for (const f of p.fields) {
      const el = document.getElementById('akf-' + f.key);
      if (!el) continue;
      const v = el.value.trim();
      if (!v && !missing) missing = f.label;
      if (v && v.length < 4 && !tooShort) tooShort = f.label;
      body[f.key] = v;
    }
    if (missing) return toast(`请填写 ${missing}`, 'err');
    if (tooShort) return toast(`${tooShort} 长度不足（至少 4 位），请确认复制完整`, 'err');
    if (btn) { btn.disabled = true; btn.textContent = '校验凭证并保存中…'; }
    await api('/oauth/apikey/' + encodeURIComponent(platform), 'POST', body);
    // 成功才关弹窗
    closeModal();
    toast('密钥探活通过，已加密保存，店铺已接入', 'ok');
    loadShops();
  } catch (e) {
    toast(e.message, 'err');
    // 失败不关弹窗，允许用户修改重新提交
  } finally {
    const el = document.getElementById('akf-save');
    if (el) { el.disabled = false; el.textContent = '校验并保存密钥'; }
  }
}

/** 域名型平台（Shopify 系）：先输入店铺域名 */
function shopDomainForm(platform) {
  openModal(`接入 ${esc(platform)}`, `
    <div class="form-row"><label>店铺域名 *</label>
      <input id="sdf-shop" placeholder="如：mystore.myshopify.com 或 store.shopline.com">
      <p style="font-size:12px;color:var(--text-3);margin-top:6px">不带 https://，输入后点击授权将跳转平台官方授权页</p></div>`,
    `<button class="btn-ghost" onclick="closeModal()">取消</button>
     <button class="btn-primary" onclick="goShopAuth('${esc(platform)}')">去官方授权</button>`);
}

async function goShopAuth(platform) {
  const shop = document.getElementById('sdf-shop').value.trim().replace(/^https?:\/\//, '').replace(/\/.*$/, '');
  if (!shop) return toast('请填写店铺域名', 'err');
  try {
    const r = await api('/oauth/authorize-url/' + encodeURIComponent(platform) + '?shop=' + encodeURIComponent(shop));
    if (r.url) location.href = r.url;
  } catch (e) { toast(e.message, 'err'); }
}

async function syncShop(id) {
  const s = shopsCache.find(x => x.id === id);
  const platName = s ? s.platform : '店铺';
  openModal(`同步 ${esc(platName)} 订单/商品`, `
    <div class="form-row"><label>同步类型</label>
      <select id="sync-type">
        <option value="orders">订单</option>
        <option value="products">商品 Listing</option>
      </select></div>
    <p style="font-size:12px;color:var(--text-3)">订单同步：拉取平台最新订单自动导入 ERP，已存在订单跳过；商品同步：同步平台在售 SKU 与价格。</p>`,
    `<button class="btn-ghost" onclick="closeModal()">取消</button>
     <button class="btn-primary" onclick="doSyncShop(${id})">开始同步</button>`);
}

async function doSyncShop(id) {
  const type = document.getElementById('sync-type').value || 'orders';
  closeModal();
  toast('正在同步，请稍候…');
  try {
    const r = await api('/shops/' + id + '/sync', 'POST', { type });
    const ok = r.result || r || {};
    if (type === 'orders') toast(`同步完成：新导入 ${ok.imported || 0} 单，跳过 ${ok.skipped || 0} 单`, 'ok');
    else toast(`同步完成：共 ${ok.total || 0} 个 SKU，新建 ${ok.created || 0}，更新 ${ok.updated || 0}`, 'ok');
    loadShops();
  } catch (e) { toast(e.message, 'err'); }
}

async function refreshToken(id) {
  try {
    const r = await api('/shops/' + id + '/refresh-token', 'POST');
    if (r && r.expires_at) toast('令牌已刷新，新到期：' + fmtDate(r.expires_at), 'ok');
    else toast('令牌已刷新', 'ok');
    loadShops();
  } catch (e) { toast(e.message, 'err'); }
}

async function unlinkShop(id) {
  if (!confirm('解除授权将清除令牌，店铺与历史数据保留。确定继续？')) return;
  try { await api('/oauth/unlink/' + id, 'POST'); toast('已解除授权', 'ok'); loadShops(); }
  catch (e) { toast(e.message, 'err'); }
}

async function toggleShop(id, status) {
  try {
    await api('/shops/' + id, 'PATCH', { status: status === 'active' ? 'inactive' : 'active' });
    loadShops();
  } catch (e) { toast(e.message, 'err'); }
}

async function delShop(id, name) {
  if (!confirm(`确定删除店铺「${name}」？不影响已有订单数据。`)) return;
  try { await api('/shops/' + id, 'DELETE'); toast('已删除', 'ok'); loadShops(); }
  catch (e) { toast(e.message, 'err'); }
}

/* ================= 经营报表（月度 + 多维度） ================= */
let reportDim = 'month'; // month | platform | shop | product | country
let reportMonth = '';    // YYYY-MM，空为本月

async function loadFinanceReport() {
  const [month, dim] = [reportMonth, reportDim];
  const q = month ? '?month=' + encodeURIComponent(month) : '';
  let endpoint = '/finance/report';
  if (dim === 'platform') endpoint = '/finance/report/by-platform' + q;
  else if (dim === 'shop') endpoint = '/finance/report/by-shop' + q;
  else if (dim === 'product') endpoint = '/finance/report/by-product' + q;
  else if (dim === 'country') endpoint = '/finance/report/by-country' + q;

  const r = await api(endpoint);
  const items = r.items || [];

  // 维度 tabs
  const tabs = [
    ['month', '月度趋势'], ['platform', '按平台'], ['shop', '按店铺'], ['product', '按商品'], ['country', '按国家/地区']
  ].map(([k, label]) =>
    `<button data-dim="${k}" class="${dim === k ? 'on' : ''}" onclick="switchReportDim('${k}')">${label}</button>`
  ).join('');

  // 收入条形图（Top 10）
  const max = Math.max(...items.map(x => Number(x.revenue) || 0), 1);
  const bars = items.slice(0, 10).map(x => `
    <div style="display:flex;align-items:center;gap:8px;margin:6px 0">
      <div style="width:150px;font-size:12px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(x.dim || x.month)}">${esc(x.dim || x.month || '-')}</div>
      <div style="flex:1;background:var(--gray-bg);border-radius:4px;height:16px;overflow:hidden">
        <div style="width:${(Number(x.revenue) / max * 100).toFixed(1)}%;height:100%;background:var(--primary);border-radius:4px"></div>
      </div>
      <div style="width:110px;text-align:right;font-size:12px">¥${Number(x.revenue || 0).toFixed(2)}</div>
    </div>`).join('');

  // 表格列按维度切换
  let thead, rows;
  if (dim === 'month') {
    thead = '<tr><th>月份</th><th>订单数</th><th>收入</th><th>商品成本</th><th>运费</th><th>平台佣金</th><th>毛利润</th><th>毛利率</th></tr>';
    rows = items.map(m => `
      <tr>
        <td><b>${esc(m.month)}</b></td><td>${m.order_count}</td>
        <td>¥${Number(m.revenue).toFixed(2)}</td>
        <td>¥${Number(m.cogs).toFixed(2)}</td>
        <td>¥${Number(m.shipping).toFixed(2)}</td>
        <td>¥${Number(m.commission).toFixed(2)}</td>
        <td><b style="color:var(--primary)">¥${Number(m.profit).toFixed(2)}</b></td>
        <td>${m.margin != null ? Number(m.margin).toFixed(2) + '%' : '-'}</td>
      </tr>`).join('');
  } else if (dim === 'product') {
    thead = '<tr><th>SKU</th><th>商品名称</th><th>销量</th><th>收入</th><th>商品成本</th><th>毛利润</th></tr>';
    rows = items.map(m => `
      <tr>
        <td><b>${esc(m.dim)}</b></td><td>${esc(m.product_name || '-')}</td><td>${m.qty_sold}</td>
        <td>¥${Number(m.revenue).toFixed(2)}</td>
        <td>¥${Number(m.cogs).toFixed(2)}</td>
        <td><b style="color:var(--primary)">¥${Number(m.profit).toFixed(2)}</b></td>
      </tr>`).join('');
  } else {
    thead = `<tr><th>${dim === 'shop' ? '店铺' : dim === 'platform' ? '平台' : '国家/地区'}</th>${dim === 'shop' ? '<th>所属平台</th>' : ''}<th>订单数</th><th>收入</th><th>商品成本</th><th>平台佣金</th><th>毛利润</th></tr>`;
    rows = items.map(m => `
      <tr>
        <td><b>${esc(m.dim)}</b></td>${dim === 'shop' ? `<td>${esc(m.platform || '-')}</td>` : ''}
        <td>${m.order_count}</td>
        <td>¥${Number(m.revenue).toFixed(2)}</td>
        <td>¥${Number(m.cogs).toFixed(2)}</td>
        <td>¥${Number(m.commission).toFixed(2)}</td>
        <td><b style="color:var(--primary)">¥${Number(m.profit).toFixed(2)}</b></td>
      </tr>`).join('');
  }

  document.getElementById('content').innerHTML = `
    <div class="card">
      <div class="card-head"><h3>经营报表（折算 CNY）</h3>
        <div style="display:flex;gap:8px;align-items:center">
          <input id="rp-month" type="month" value="${esc(month)}" style="padding:6px 8px;border:1px solid var(--border);border-radius:8px" onchange="setReportMonth(this.value)">
          ${month ? `<button class="btn-sm neutral" onclick="setReportMonth('')">本月</button>` : ''}
        </div></div>
      <div class="seg-tabs">${tabs}</div>
      ${bars ? `<div style="margin-bottom:14px"><div style="font-size:12px;color:var(--text-3);margin-bottom:4px">收入 Top ${Math.min(items.length, 10)}（¥，CNY 口径）</div>${bars}</div>` : ''}
      <div class="table-wrap"><table>
        <thead>${thead}</thead>
        <tbody>${items.length ? rows : `<tr><td colspan="8"><div class="empty">暂无数据</div></td></tr>`}
        </tbody></table></div>
      <p style="color:var(--text-3);font-size:12px;margin-top:10px">所有金额按订单下单时汇率折算为人民币（CNY）。维度报表默认统计本月，可用右上角月份选择器切换。</p>
    </div>`;
}

function switchReportDim(d) { reportDim = d; loadFinanceReport(); }
function setReportMonth(m) { reportMonth = m; loadFinanceReport(); }

/* ================= 采购管理 ================= */
const PO_STATUS_LABEL = { DRAFT: '待入库', RECEIVED: '已入库', CANCELLED: '已取消' };
const PO_STATUS_CLASS = { DRAFT: 'amber', RECEIVED: 'green', CANCELLED: 'red' };
let suppliersCache = [];

async function loadPurchases() {
  const [rp, rs, rpr] = await Promise.all([
    api('/purchases'), api('/purchases/suppliers'), api('/products')
  ]);
  suppliersCache = rs.items;
  productsCache = rpr.items;
  document.getElementById('content').innerHTML = `
    <div class="stat-grid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">
      <div class="stat-card"><div class="s-label">供应商</div><div class="s-value">${rs.items.length}</div></div>
      <div class="stat-card"><div class="s-label">待入库采购单</div><div class="s-value">${rp.items.filter(p => p.status === 'DRAFT').length}</div></div>
      <div class="stat-card"><div class="s-label">本月采购额</div><div class="s-value">${fmtMoney(rp.items.filter(p => p.status === 'RECEIVED').reduce((s, p) => s + Number(p.total_amount), 0))}</div></div>
    </div>
    <div class="card" style="margin-bottom:20px">
      <div class="card-head"><h3>供应商（${rs.items.length}）</h3>
        <button class="btn-primary btn-sm" onclick="supplierForm()">+ 新增供应商</button></div>
      <div class="table-wrap"><table>
        <thead><tr><th>名称</th><th>联系人</th><th>电话</th><th>采购单数</th><th>操作</th></tr></thead>
        <tbody>${rs.items.length ? rs.items.map(s => `
          <tr>
            <td><b>${esc(s.name)}</b></td><td>${esc(s.contact) || '-'}</td><td>${esc(s.phone) || '-'}</td><td>${s.po_count}</td>
            <td><button class="btn-sm danger" onclick="delSupplier(${s.id}, '${esc(s.name)}')">删除</button></td>
          </tr>`).join('') : `<tr><td colspan="5"><div class="empty">暂无供应商</div></td></tr>`}
        </tbody></table></div>
    </div>
    <div class="card">
      <div class="card-head"><h3>采购单列表（${rp.items.length}）</h3>
        <button class="btn-primary btn-sm" onclick="purchaseForm()">+ 新建采购单</button></div>
      <div class="table-wrap"><table>
        <thead><tr><th>采购单号</th><th>供应商</th><th>状态</th><th>总数量</th><th>总金额</th><th>创建时间</th><th>操作</th></tr></thead>
        <tbody>${rp.items.length ? rp.items.map(p => `
          <tr>
            <td><b>${esc(p.purchase_no)}</b></td><td>${esc(p.supplier_name) || '-'}</td>
            <td><span class="badge ${PO_STATUS_CLASS[p.status]}">${PO_STATUS_LABEL[p.status]}</span></td>
            <td>${p.total_qty}</td><td>${fmtMoney(p.total_amount)}</td>
            <td style="white-space:nowrap">${fmtDate(p.created_at)}</td>
            <td style="white-space:nowrap">${poActions(p)}</td>
          </tr>`).join('') : `<tr><td colspan="7"><div class="empty">暂无采购单</div></td></tr>`}
        </tbody></table></div>
    </div>`;
}

function poActions(p) {
  if (p.status === 'DRAFT') {
    return `<button class="btn-sm primary" onclick="receivePo(${p.id}, '${esc(p.purchase_no)}')">入库</button>
            <button class="btn-sm danger" onclick="cancelPo(${p.id})">取消</button>`;
  }
  return '<span style="color:var(--text-3)">—</span>';
}

function supplierForm() {
  openModal('新增供应商', `
    <div class="form-row"><label>供应商名称 *</label><input id="sp-name" placeholder="如：深圳华强北电子厂"></div>
    <div class="form-grid">
      <div class="form-row"><label>联系人</label><input id="sp-contact" placeholder="如：王经理"></div>
      <div class="form-row"><label>电话</label><input id="sp-phone"></div>
    </div>`,
    `<button class="btn-ghost" onclick="closeModal()">取消</button>
     <button class="btn-primary" onclick="saveSupplier()">保存</button>`);
}

async function saveSupplier() {
  try {
    const name = document.getElementById('sp-name').value.trim();
    if (!name) return toast('请填写供应商名称', 'err');
    await api('/purchases/suppliers', 'POST', {
      name,
      contact: document.getElementById('sp-contact').value.trim() || null,
      phone: document.getElementById('sp-phone').value.trim() || null
    });
    closeModal(); toast('供应商已添加', 'ok');
    loadPurchases();
  } catch (e) { toast(e.message, 'err'); }
}

async function delSupplier(id, name) {
  if (!confirm(`确定删除供应商「${name}」？`)) return;
  try { await api('/purchases/suppliers/' + id, 'DELETE'); toast('已删除', 'ok'); loadPurchases(); }
  catch (e) { toast(e.message, 'err'); }
}

function purchaseForm() {
  if (!productsCache.length) return toast('请先在「商品管理」新增商品', 'err');
  const supOpts = suppliersCache.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('');
  openModal('新建采购单', `
    <div class="form-row"><label>供应商</label><select id="po-supplier"><option value="">不关联</option>${supOpts}</select></div>
    <div class="form-row"><label>采购明细 *</label><div id="po-items"></div>
      <button class="add-item-btn" onclick="addPoItem()">+ 添加采购行</button></div>
    <div class="form-row"><label>备注</label><input id="po-remark" placeholder="选填"></div>`,
    `<button class="btn-ghost" onclick="closeModal()">取消</button>
     <button class="btn-primary" onclick="savePurchase()">创建采购单</button>`, true);
  addPoItem();
}

function addPoItem() {
  const opts = productsCache.map(p => `<option value="${p.id}" data-cost="${p.cost}">${esc(p.sku)} · ${esc(p.name)}</option>`).join('');
  const div = document.createElement('div');
  div.className = 'item-row';
  div.innerHTML = `
    <select class="po-prod">${opts}</select>
    <input class="po-qty" type="number" min="1" value="1" placeholder="数量">
    <input class="po-cost" type="number" step="0.01" min="0" placeholder="单价">
    <button class="del" onclick="this.parentElement.remove()">×</button>`;
  document.getElementById('po-items').appendChild(div);
  const sel = div.querySelector('.po-prod');
  div.querySelector('.po-cost').value = sel.selectedOptions[0]?.dataset.cost || 0;
}

async function savePurchase() {
  try {
    const items = [];
    document.querySelectorAll('.item-row').forEach(r => {
      const pid = Number(r.querySelector('.po-prod').value);
      const qty = parseInt(r.querySelector('.po-qty').value, 10);
      const cost = Number(r.querySelector('.po-cost').value) || 0;
      if (pid && qty > 0) items.push({ product_id: pid, qty, unit_cost: cost });
    });
    if (!items.length) return toast('请至少添加一个采购行', 'err');
    await api('/purchases', 'POST', {
      supplier_id: Number(document.getElementById('po-supplier').value) || null,
      remark: document.getElementById('po-remark').value.trim() || null,
      items
    });
    closeModal(); toast('采购单已创建（待入库）', 'ok');
    loadPurchases();
  } catch (e) { toast(e.message, 'err'); }
}

async function receivePo(id, no) {
  if (!confirm(`确认采购单「${no}」入库？库存将增加，商品成本将更新为本次采购价。`)) return;
  try { await api(`/purchases/${id}/receive`, 'POST'); toast('入库成功，库存已回写', 'ok'); loadPurchases(); }
  catch (e) { toast(e.message, 'err'); }
}

async function cancelPo(id) {
  if (!confirm('确定取消该采购单？')) return;
  try { await api(`/purchases/${id}/cancel`, 'POST'); toast('已取消', 'ok'); loadPurchases(); }
  catch (e) { toast(e.message, 'err'); }
}
